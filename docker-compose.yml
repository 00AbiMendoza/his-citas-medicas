services:
  mysql:
    image: mysql:8.0
    container_name: his_citas_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_2026
      MYSQL_DATABASE: his_citas
      MYSQL_USER: his_user
      MYSQL_PASSWORD: his_password_2026
    ports:
      - "3306:3306"
    volumes:
      - his_citas_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_2026"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  his_citas_mysql_data:
    driver: local
